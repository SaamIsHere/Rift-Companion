name: Release Rift Companion

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Extract version from tauri.conf.json
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "Detected app version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release tag already exists
        id: check_tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.get_version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists on GitHub."
            if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Manual trigger or tag push detected: proceeding with build."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping release build because $TAG is already released."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Release $TAG does not exist yet. Proceeding with build."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable (MSVC)
        if: steps.check_tag.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        if: steps.check_tag.outputs.should_release == 'true'
        run: npm ci

      - name: Run Svelte type-check
        if: steps.check_tag.outputs.should_release == 'true'
        run: npm run check

      - name: Run Backend unit tests
        if: steps.check_tag.outputs.should_release == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri NSIS Installer & Updater Package
        if: steps.check_tag.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.get_version.outputs.tag }}
          releaseName: 'Rift Companion ${{ steps.get_version.outputs.tag }}'
          releaseBody: |
            ## Rift Companion Release ${{ steps.get_version.outputs.tag }}

            ### Highlights
            * **Item & Summoner Spell Game Counts + 4th/5th/6th Item Pick Rates Fixed:**
              * Updated OP.GG build parsing for lowercase `"games"` labels, restoring absolute game counts for Summoner Spells, Starter Items, Boots, Core Items, Skill Order, and 4th/5th/6th item slots.
              * Restored 4th, 5th, and 6th item pick rates from game counts and fixed sub-1% pick-rate scaling in the In-Game Dashboard.
            * **Accurate Personal Ban History & Suggestions:**
              * Fixed LCU champ-select sub-events resetting the ban-recording guard mid-draft and prevented missing `localPlayerCellId` values from defaulting to cell `0`.
              * Scoped recorded ban history per Riot account (`puuid`) so each account maintains its own accurate ban suggestions.
            * **Full TFT Set 18 Meta Comps Restoration:**
              * Updated the TFT crawler to OP.GG's new `v4` schema, restoring all 46+ meta compositions across S, A, B, C, and D tiers with live UI sync on server refresh.
            * **TFT Wallpaper & Hover Popover Clipping Fix:**
              * Fixed the TFT tab displaying a black background when switching from the Home landing page when custom wallpapers are enabled.
              * Portaled the TFT comp hover popover with dynamic viewport-aware positioning so it never clips underneath the TFT sub-tab bar or top navigation bar.
            * **Reliable LCU Re-Detection Across League Restarts:**
              * Added a 3-second process/lockfile liveness check, HTTP/WebSocket timeouts, and profile re-confirmation so closing and relaunching League of Legends while Rift Companion stays open is always detected.

            ### Download & Installation
            * **Windows Installer:** Download `Rift-Companion_${{ steps.get_version.outputs.version }}_x64-setup.exe` below and double-click to install.
            * **In-App Auto-Updater:** If you already have Rift Companion installed, it will automatically notify you and update seamlessly!

            *Rift Companion isn't endorsed by Riot Games and doesn't reflect the views or opinions of Riot Games.*
          releaseDraft: false
          prerelease: false
