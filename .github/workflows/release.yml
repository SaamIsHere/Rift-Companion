name: Release Rift Companion

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Extract version from tauri.conf.json
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "Detected app version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release tag already exists
        id: check_tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.get_version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists on GitHub."
            if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Manual trigger or tag push detected: proceeding with build."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping release build because $TAG is already released."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Release $TAG does not exist yet. Proceeding with build."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable (MSVC)
        if: steps.check_tag.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        if: steps.check_tag.outputs.should_release == 'true'
        run: npm ci

      - name: Build Tauri NSIS Installer & Updater Package
        if: steps.check_tag.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.get_version.outputs.tag }}
          releaseName: 'Rift Companion ${{ steps.get_version.outputs.tag }}'
          releaseBody: |
            ## Rift Companion Release ${{ steps.get_version.outputs.tag }}

            ### Highlights
            * **Clickable Players in Match History:** Summoners in expanded match scoreboards can now be clicked directly to open and view their full player profile and recent match history.
            * **Improved Small Window Layout:** Completely eliminated player name, level, and KDA clipping on smaller window sizes with responsive scoreboard scaling and optimized profile sidecard widths.
            * **Profile & Match Navigation Polish:** Clean hover outline on scoreboard player rows and guaranteed collapse reset on profile loads to ensure proper match data fetching.
            * **App Startup Fix:** Resolved startup compilation and target directory path issues on systems with space-separated workspace directories.

            ### Download & Installation
            * **Windows Installer:** Download `Rift-Companion_${{ steps.get_version.outputs.version }}_x64-setup.exe` below and double-click to install.
            * **In-App Auto-Updater:** If you already have Rift Companion installed, it will automatically notify you and update seamlessly!

            *Rift Companion isn't endorsed by Riot Games and doesn't reflect the views or opinions of Riot Games.*
          releaseDraft: false
          prerelease: false
