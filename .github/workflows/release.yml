name: Release Rift Companion

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Extract version from tauri.conf.json
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "Detected app version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release tag already exists
        id: check_tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.get_version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists on GitHub."
            if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Manual trigger or tag push detected: proceeding with build."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping release build because $TAG is already released."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Release $TAG does not exist yet. Proceeding with build."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable (MSVC)
        if: steps.check_tag.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        if: steps.check_tag.outputs.should_release == 'true'
        run: npm ci

      - name: Run Svelte type-check
        if: steps.check_tag.outputs.should_release == 'true'
        run: npm run check

      - name: Run Backend unit tests
        if: steps.check_tag.outputs.should_release == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri NSIS Installer & Updater Package
        if: steps.check_tag.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.get_version.outputs.tag }}
          releaseName: 'Rift Companion ${{ steps.get_version.outputs.tag }}'
          releaseBody: |
            ## Rift Companion Release ${{ steps.get_version.outputs.tag }}

            ### Highlights
            * **Post-Game Screen Overhaul & Enhancements:**
              * **Timeline & Analysis Graph:** Added an interactive team gold advantage SVG area chart with real-time mouse scrubber HUD, minute-by-minute gold swings, objective milestone callouts (Dragons, Barons, Turrets), and automatic epic comeback detection.
              * **Comparative Damage Breakdown:** Added team-level physical vs. magic vs. true damage distribution comparison bars as well as per-player AD/AP/True damage splits to assess threat profiles at a glance.
              * **Game-Mode Specific Post-Game (ARAM & Arena):** Tailored scoring algorithms and visual layouts for Howling Abyss (ARAM) and Rings of Wrath (Arena). Standard lane roles and vision scoring are omitted, CS expectations are adapted, and game-mode specific badges have been added (Abyss Legend, Brawler, Teamfight Anchor, Snowball Sniper, Abyss Medic, Siege Ram, Arena Champion, Gladiator).
              * **7th Item Slot & ADC Boots:** Added dedicated 7th item slot display above trinkets for ADC boots, role quests, and jungle items.
              * **Scoreboard & Tab Improvements:** Display match rank badge (#1..#10) directly next to champion avatars in Damage, Defense, and Economy tabs, with a sort dropdown filter to sort participants by damage, DPM, rank, total defended, gold, or CS.
              * **Badge Balancing & Clarifications:** Rebalanced badge thresholds to scale with match duration (Damage Sponge, Wrecking Ball, CC Overlord, Ward Hunter) and clarified criteria descriptions for Monster Hunter, Glass Cannon, and Vision Lord.
            * **League Client Match History Investigation:** Investigated and verified read-only interaction with client endpoints to ensure companion operations do not impact League of Legends match history synchronization.

            ### Download & Installation
            * **Windows Installer:** Download `Rift-Companion_${{ steps.get_version.outputs.version }}_x64-setup.exe` below and double-click to install.
            * **In-App Auto-Updater:** If you already have Rift Companion installed, it will automatically notify you and update seamlessly!

            *Rift Companion isn't endorsed by Riot Games and doesn't reflect the views or opinions of Riot Games.*
          releaseDraft: false
          prerelease: false
