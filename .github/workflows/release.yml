name: Release Rift Companion

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Extract version from tauri.conf.json
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "Detected app version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release tag already exists
        id: check_tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.get_version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists on GitHub."
            if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Manual trigger or tag push detected: proceeding with build."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping release build because $TAG is already released."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Release $TAG does not exist yet. Proceeding with build."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable (MSVC)
        if: steps.check_tag.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        if: steps.check_tag.outputs.should_release == 'true'
        run: npm ci

      - name: Run Svelte type-check
        if: steps.check_tag.outputs.should_release == 'true'
        run: npm run check

      - name: Run Backend unit tests
        if: steps.check_tag.outputs.should_release == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri NSIS Installer & Updater Package
        if: steps.check_tag.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.get_version.outputs.tag }}
          releaseName: 'Rift Companion ${{ steps.get_version.outputs.tag }}'
          releaseBody: |
            ## Rift Companion Release ${{ steps.get_version.outputs.tag }}

            ### Highlights
            * **Automatic Game Mode & ARAM Mayhem Detection:**
              * Replaced manual mode switching in the Live Match view with seamless automatic detection for Summoner's Rift, ARAM (Queue 450), and ARAM Mayhem (Queue 2400 / KIWI / MAYHEM).
              * Direct real-time synchronization with LCU gameflow session, live client polling, and WebSocket events.
            * **ARAM Mayhem Rune Suppression:**
              * Automatically hides the runes column in Live Match when ARAM Mayhem is active, as runes are replaced by augments in Mayhem.
              * Dynamically expands Summoner Spells and Item Sets across the entire container width with a clear `ARAM Mayhem (No Runes)` status badge.
            * **Item Set Accumulation Fix & Automatic Replacement:**
              * Fixed a persistent bug where companion item sets accumulated indefinitely across matches.
              * Importing an item set (auto or manual) now automatically replaces previous Rift Companion item sets, keeping only the active champion's set while preserving all user-made custom sets.
            * **Dedicated Item Sets Cleanup Tool:**
              * Added a new **"Clean Up Item Sets"** action in Settings (under Item Sets Cleanup) to immediately purge all accumulated Rift Companion item sets from the League client via LCU API.
            * **Settings UI Redesign:**
              * Redesigned Auto-Import settings with overarching tabs for *Summoner's Rift* and *ARAM*, each containing three compact, unified buttons for *Runes*, *Summoners*, and *Item Sets*.
              * Removed the obsolete manual ARAM Mayhem toggle since detection is now 100% automated.
            * **Visual Polish & Complete English Localization:**
              * Removed tree (🌲) and snowflake (❄️) emojis across settings tabs, live match badges, and post-game screens.
              * Standardized all remaining German UI strings across settings, profile, and simulation views to clean, consistent English.

            ### Download & Installation
            * **Windows Installer:** Download `Rift-Companion_${{ steps.get_version.outputs.version }}_x64-setup.exe` below and double-click to install.
            * **In-App Auto-Updater:** If you already have Rift Companion installed, it will automatically notify you and update seamlessly!

            *Rift Companion isn't endorsed by Riot Games and doesn't reflect the views or opinions of Riot Games.*
          releaseDraft: false
          prerelease: false
