# NOTE: do not hardcode an absolute `target-dir` here — it would tie the repo
# to one machine/user account and break every other clone (see project-docs/development.md,
# "Windows build notes").
#
# Context: with the GNU Rust toolchain (`x86_64-pc-windows-gnu`), Tauri's
# `windres` resource-compile step passes an unquoted OUT_DIR (under target/)
# to cc1.exe; if that path contains a space, the space splits the argument and
# the build fails with `cc1.exe: fatal error: ...: No such file or directory`.
# The MSVC toolchain (`x86_64-pc-windows-msvc`, Tauri's recommended default on
# Windows) uses `rc.exe`/`llvm-rc` instead of `windres` and never hits this.
#
# If you're on the GNU toolchain and your checkout path contains a space, set
# `CARGO_TARGET_DIR` to a space-free directory as an environment variable
# (locally, not committed) instead of overriding `target-dir` here.
