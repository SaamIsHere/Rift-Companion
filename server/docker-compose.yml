services:
  rift-server:
    build: .
    container_name: rift-server
    restart: unless-stopped
    ports:
      - "8085:8085"
    volumes:
      - ./data:/data
    environment:
      - PORT=8085
      - DATA_DIR=/data
      - CRAWL_CONCURRENCY=6
      - CRON_HOUR=4
      - RIFT_API_KEY=${RIFT_API_KEY:-}
      - RIFT_ADMIN_KEY=${RIFT_ADMIN_KEY:-}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rift-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - rift-server
